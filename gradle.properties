org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=false
# Uncomment if the wrapper is launched with a JDK newer than 21:
# org.gradle.java.home=D:/Desktop/adroid_m3/.jdk/jdk-17.0.20.1+1

# Maven Central POM (replace with the public Git repo URL before the first release)
POM_URL=https://github.com/your-org/genev4
POM_SCM_CONNECTION=scm:git:git://github.com/your-org/genev4.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/your-org/genev4.git
