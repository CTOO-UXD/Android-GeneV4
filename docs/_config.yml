# GeneV4 docs site (GitHub Pages)
# https://ctoo-uxd.github.io/Android-GeneV4/
#
# Repo Settings → Pages → Deploy from a branch → main → /docs

title: GeneV4
description: Android Jetpack Compose component library (com.genev4)
url: https://ctoo-uxd.github.io
baseurl: /Android-GeneV4

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/CTOO-UXD/Android-GeneV4"
  "Maven Central":
    - "https://central.sonatype.com/artifact/io.github.ctoo-uxd/genev4"

aux_links_new_tab: true

# Maintainer notes stay in the repo but out of the main nav.
exclude:
  - README.md

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/CTOO-UXD/Android-GeneV4"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

color_scheme: nil
